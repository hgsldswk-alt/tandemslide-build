name: TandemSlide
options:
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  knownRegions: [en]
settings:
  base:
    APP_ID: com.hgsldswk.tandemslide
    APP_STORE_ID: "6837842130"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
targets:
  TandemSlide:
    type: application
    platform: iOS
    sources: [TandemSlide, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_ID)
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: TandemSlide AppStore
    info:
      path: TandemSlide/Info.plist
      properties:
        CFBundleDisplayName: Tandem Slide
        CFBundleDevelopmentRegion: en
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        APP_STORE_ID: $(APP_STORE_ID)
        TandemSlideProProductID: $(APP_ID).pro
        TandemSlideTrialProductID: $(APP_ID).trial
  TandemSlideTests:
    type: bundle.unit-test
    platform: iOS
    sources: [TandemSlideTests, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_ID).tests
        GENERATE_INFOPLIST_FILE: YES
  TandemSlideUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [TandemSlideUITests]
    dependencies:
      - target: TandemSlide
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_ID).uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: TandemSlide
schemes:
  TandemSlide:
    build:
      targets:
        TandemSlide: all
        TandemSlideTests: [test]
    test:
      config: Debug
      targets: [TandemSlideTests]
  TandemSlideUI:
    build:
      targets:
        TandemSlide: all
        TandemSlideUITests: [test]
    test:
      config: Debug
      targets: [TandemSlideUITests]
